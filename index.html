<!-- HEADER / BARRA SUPERIOR CON TU NUEVO LOGO -->
<header class="bg-slate-800/95 backdrop-blur-md border-b border-slate-700/80 sticky top-0 z-40 px-3.5 py-2.5 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3 min-w-0 flex-1 mr-2">
        <!-- LOGO DE LA CAJA ESTILIZADO -->
        <img src="logo.jpg" alt="Logo" class="w-10 h-10 md:w-11 md:h-11 object-cover rounded-xl shadow-md border border-slate-700/85 bg-slate-900 shrink-0">
        <div class="min-w-0 flex-1">
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white truncate leading-tight">LudovicApp stock</h1>
            <p class="text-xs text-slate-400 truncate hidden sm:block">Control de Insumos de Laboratorio</p>
        </div>
    </div>

    <nav class="hidden md:flex items-center space-x-1 bg-slate-900/60 p-1 rounded-xl border border-slate-700 shrink-0">
        <button onclick="switchTab('inventory')" id="pc-btn-inventory" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-lab-400 bg-slate-800 shadow transition flex items-center gap-1.5">
            <i class="fa-solid fa-boxes-stacked"></i> Inventario
        </button>
        <button onclick="switchTab('scan')" id="pc-btn-scan" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-400 hover:text-white transition flex items-center gap-1.5">
            <i class="fa-solid fa-barcode"></i> Escáner
        </button>
        <button onclick="switchTab('labels')" id="pc-btn-labels" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-400 hover:text-white transition flex items-center gap-1.5">
            <i class="fa-solid fa-tags"></i> Etiquetas
        </button>
        <button onclick="switchTab('settings')" id="pc-btn-settings" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-400 hover:text-white transition flex items-center gap-1.5">
            <i class="fa-solid fa-gear"></i> Ajustes
        </button>
    </nav>

    <div class="flex items-center space-x-2 shrink-0">
        <div id="cloudStatus" class="flex items-center space-x-1.5 text-xs bg-slate-900/80 border border-slate-700/80 px-3 py-1 rounded-full text-slate-300">
            <span id="statusIndicator" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="statusText">Conectando...</span>
        </div>
    </div>
</header>
